<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summarize.it</title>
    <meta name="description" content="A free online tool that uses AI to summarize long pieces of text into concise, easy-to-read summaries.">
    <meta name="keywords" content="text summarization, AI, online tool">
    <link rel="icon" href="https://emoji.gg/assets/emoji/1234.png" type="image/png">
    <meta property="og:title" content="Summarize.it">
    <meta property="og:description" content="A free online tool that uses AI to summarize long pieces of text into concise, easy-to-read summaries.">
    <meta property="og:image" content="https://via.placeholder.com/1200x630">
    <style>
        :root {
            --primary-color: #212121;
            --secondary-color: #333;
            --background-color: #1a1a1a;
            --text-color: #fff;
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-weight: bold;
            font-size: 24px;
        }
        .header button {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .header button:hover {
            background-color: var(--primary-color);
        }
        .input-area {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .input-area textarea {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            resize: vertical;
        }
        .input-area select {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
        }
        .button-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .button-area button {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .button-area button:hover {
            background-color: var(--primary-color);
        }
        .summary-area {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--secondary-color);
        }
        .summary-area button {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .summary-area button:hover {
            background-color: var(--secondary-color);
        }
        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            background-color: var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: none;
        }
        .settings-panel input {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
        }
        .settings-panel button {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .settings-panel button:hover {
            background-color: var(--primary-color);
        }
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .footer a {
            text-decoration: none;
            color: var(--text-color);
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .header {
                flex-direction: column;
            }
            .header h1 {
                margin-bottom: 10px;
            }
            .input-area {
                margin-bottom: 10px;
            }
            .button-area {
                flex-direction: column;
            }
            .button-area button {
                margin-bottom: 10px;
            }
            .summary-area {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Summarize.it</h1>
            <button id="settings-button">Settings</button>
        </div>
        <div class="input-area">
            <textarea id="input-text" placeholder="Paste text to summarize"></textarea>
            <select id="summary-length">
                <option value="50">50 words</option>
                <option value="100">100 words</option>
                <option value="200">200 words</option>
            </select>
        </div>
        <div class="button-area">
            <button id="generate-summary-button">Generate Summary</button>
            <button id="copy-summary-button" style="display: none;">Copy Summary</button>
        </div>
        <div class="summary-area" id="summary-area" style="display: none;"></div>
        <div class="settings-panel" id="settings-panel">
            <input id="api-key-input" type="text" placeholder="Enter your Groq API key">
            <button id="save-api-key-button">Save</button>
        </div>
        <div class="footer">
            <a href="https://aiappfactory.com" target="_blank">Built with AI App Factory</a>
        </div>
    </div>
    <script>
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveApiKeyButton = document.getElementById('save-api-key-button');
        const inputText = document.getElementById('input-text');
        const summaryLength = document.getElementById('summary-length');
        const generateSummaryButton = document.getElementById('generate-summary-button');
        const copySummaryButton = document.getElementById('copy-summary-button');
        const summaryArea = document.getElementById('summary-area');
        let apiKey = localStorage.getItem('apiKey');

        settingsButton.addEventListener('click', () => {
            settingsPanel.style.display = 'block';
        });

        saveApiKeyButton.addEventListener('click', () => {
            apiKey = apiKeyInput.value;
            localStorage.setItem('apiKey', apiKey);
            settingsPanel.style.display = 'none';
        });

        generateSummaryButton.addEventListener('click', async () => {
            const text = inputText.value;
            const length = summaryLength.value;
            if (!apiKey) {
                alert('Please enter your Groq API key in the settings panel');
                return;
            }
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        prompt: `Summarize the following text in ${length} words: ${text}`,
                        max_tokens: 1024
                    })
                });
                const data = await response.json();
                const summary = data.choices[0].text;
                summaryArea.innerText = summary;
                summaryArea.style.display = 'block';
                copySummaryButton.style.display = 'block';
            } catch (error) {
                console.error(error);
                alert('Error generating summary');
            }
        });

        copySummaryButton.addEventListener('click', () => {
            navigator.clipboard.writeText(summaryArea.innerText);
            alert('Summary copied to clipboard');
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                settingsPanel.style.display = 'none';
            }
        });
    </script>
</body>
</html>
